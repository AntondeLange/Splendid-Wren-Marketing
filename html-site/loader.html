<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<meta http-equiv="refresh" content="8;url=index.html?from=loader" />
<title>Logo Loader</title>
<style>
  html,
  body {
    margin: 0;
    height: 100%;
    background: #ffffff;
  }

  body {
    display: grid;
    place-items: center;
  }

  .loader {
    width: min(480px, 90vw);
  }

  .loader img {
    display: block;
    width: 100%;
    height: auto;
  }
</style>
</head>
<body>
  <div class="loader">
    <img src="images/logo_loader.svg" alt="Splendid Wren Marketing" width="687" height="532" />
  </div>
</body>
</html>
