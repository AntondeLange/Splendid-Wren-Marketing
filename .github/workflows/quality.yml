name: Quality Gate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: astro-site/package-lock.json

      - name: Install
        run: npm --prefix astro-site ci

      - name: Typecheck
        run: npm --prefix astro-site run typecheck

      - name: Build
        run: npm --prefix astro-site run build

      - name: Audit Production Dependencies
        run: npm --prefix astro-site audit --omit=dev --audit-level=high
